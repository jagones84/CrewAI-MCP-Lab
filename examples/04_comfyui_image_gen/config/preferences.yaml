comfyui:
  allow_mock_fallback: false
  host: 127.0.0.1
  mcp_server: comfyui-dgspark
  output_path: outputs/generated_image.png
  port: 11002
  workflow: image_perfectDeliberate_text_to_image_API.json
llm:
  llamacpp:
    base_url: http://localhost:11003/v1
    model: qwen-3.6-35b-a3b-claude47-opus-abliterated
  model: google/gemini-2.5-flash-lite
  ollama:
    base_url: http://localhost:11434/v1
    model: llama3:latest
  openai:
    model: gpt-4o-mini
  provider: openrouter
  temperature: 0.4
run:
  also_remove_background: false
  bg_removed_path: outputs/no_bg.png
  denoise: 0.55
  edit_prompt: Darker, more cinematic version with stronger rim lighting and a moodier
    palette.
  generated_path: outputs/generated.png
  modified_path: outputs/modified.png
  negative_prompt: blurry, low resolution, watermark, text, signature, cropped
  pipeline: simple
  prompt: A neon-lit cyberpunk dragon soaring above a rainy Tokyo skyline, cinematic
    lighting, ultra detailed, 8k, volumetric fog
  seed: 42
  upscale_model: 4x-UltraSharp.pth
  upscaled_path: outputs/upscaled.png
